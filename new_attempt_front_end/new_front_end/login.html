<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU-SPACEEASE - Login</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Main login/signup page styles */
        body {
            background-image: linear-gradient(135deg, #6e44ff 0%, #4a00e0 50%, #000000 100%);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            width: 400px;
            text-align: center;
        }

        .login-container h2 {
            color: #b19cd9;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .login-container form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-control {
            margin-bottom: 20px;
            border-radius: 50px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            padding: 10px 20px;
        }

        .form-control::placeholder {
            color: #b19cd9;
        }

        .btn-primary {
            background-image: linear-gradient(135deg, #b19cd9 0%, #6e44ff 100%);
            border: none;
            padding: 10px 40px;
            border-radius: 50px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.5s ease;
        }

        .btn-primary:hover {
            background-image: linear-gradient(135deg, #4a00e0 0%, #000000 100%);
        }

        .form-links {
            margin-top: 15px;
        }

        .form-links a {
            color: #b19cd9;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .form-links a:hover {
            color: #fff;
        }

        /* Non-interactive animation: Subtle background gradient shift */
        @keyframes backgroundShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background-size: 200% 200%;
            animation: backgroundShift 10s ease infinite;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to HU-SPACEEASE</h2>
        <form action="index.html" method="POST">

            <input type="email" class="form-control" placeholder="Email" required>
            <input type="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="form-links">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent the default form submission

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            const response = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, email }),
            });

            const result = await response.json();
            document.getElementById('message').innerText = result.message;
        });
    </script>

</body>
</html>
